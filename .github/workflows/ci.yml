name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/checkout@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Ruff Linter
      run: ruff check . --config configs/ruff.toml

    - name: Run Ruff Formatter
      run: ruff format --check . --config configs/ruff.toml

    - name: Run Unit Tests
      run: |
        python -m pytest tests/
      env:
        PYTHONPATH: .
